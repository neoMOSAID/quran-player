
[daemon]
; Maximum log size in bytes before rotation
max_log_size = 1000000
; CRITICAL | ERROR | WARNING | INFO | DEBUG | DISABLED
log_level = INFO
; Directory containing audio files (leave empty to use bundled sample/)
files_directory =

[conky]
; Show the current verse on the desktop via Conky
enable = yes
; Path to conky executable (empty = auto-detect from PATH)
executable =

